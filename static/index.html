<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORA Search Provider Benchmark Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23131d28'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' font-family='Arial' font-weight='700' fill='%23f6f3eb'%3EV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2efe7;
    --panel: rgba(255, 250, 242, 0.88);
    --panel-strong: #fffdf8;
    --line: rgba(31, 41, 55, 0.12);
    --line-strong: rgba(31, 41, 55, 0.22);
    --text: #1d2430;
    --muted: #5e6875;
    --accent: #0d5c63;
    --accent-soft: #d5ece9;
    --accent-strong: #083d42;
    --warm: #b86a1b;
    --danger: #b23a30;
    --success: #24704c;
    --warning: #8f5a13;
    --shadow: 0 18px 48px rgba(34, 40, 49, 0.1);
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Manrope", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top left, rgba(13, 92, 99, 0.18), transparent 28%),
      radial-gradient(circle at top right, rgba(184, 106, 27, 0.14), transparent 24%),
      linear-gradient(180deg, #f6f2e9 0%, #f1ede3 45%, #ece7dc 100%);
  }

  .shell {
    width: min(1380px, calc(100% - 28px));
    margin: 16px auto 48px;
    display: grid;
    gap: 16px;
  }

  .topbar,
  .control-band,
  .comparison-panel,
  .provider-card,
  .result-panel {
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
  }

  .topbar,
  .control-band,
  .comparison-panel {
    padding: 16px 18px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .brand {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .brand-mark {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--accent-strong), var(--warm));
    color: #fff;
    border-radius: 10px;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
  }

  .brand h1,
  .brand p,
  .comparison-panel h2,
  .result-panel h2,
  .section-title {
    margin: 0;
  }

  h1, h2, h3, .eyebrow {
    font-family: "Space Grotesk", sans-serif;
    letter-spacing: 0;
  }

  .brand h1 {
    font-size: 20px;
  }

  .brand p {
    font-size: 12px;
    color: var(--muted);
  }

  .topbar-note {
    padding: 8px 12px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-size: 12px;
    font-weight: 700;
  }

  .control-band {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) auto auto;
    gap: 10px;
    align-items: end;
  }

  .field {
    display: grid;
    gap: 6px;
  }

  .field label,
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
  }

  input,
  button {
    font: inherit;
  }

  input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.82);
    color: var(--text);
  }

  input:focus {
    outline: none;
    border-color: rgba(13, 92, 99, 0.48);
    box-shadow: 0 0 0 3px rgba(13, 92, 99, 0.1);
  }

  button {
    border: 0;
    border-radius: 8px;
    padding: 14px 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .button-primary {
    background: linear-gradient(135deg, var(--accent-strong), var(--accent));
    color: #fff;
  }

  .button-secondary {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid var(--line-strong);
    color: var(--text);
  }

  button:disabled {
    cursor: wait;
    opacity: 0.65;
  }

  .provider-grid,
  .results-grid {
    display: grid;
    gap: 12px;
  }

  .provider-grid {
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  }

  .provider-card,
  .result-panel {
    padding: 16px;
    border-radius: 8px;
  }

  .provider-card {
    display: grid;
    gap: 14px;
  }

  .provider-head,
  .result-head {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 12px;
  }

  .provider-title {
    display: grid;
    gap: 3px;
  }

  .provider-title h2,
  .result-head h2 {
    font-size: 18px;
  }

  .provider-meta,
  .run-metrics,
  .comparison-grid,
  .supplier-grid {
    display: grid;
    gap: 8px;
  }

  .provider-meta,
  .run-metrics,
  .comparison-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .metric {
    border: 1px solid rgba(31, 41, 55, 0.08);
    background: rgba(255, 255, 255, 0.72);
    border-radius: 8px;
    padding: 10px 12px;
    min-height: 68px;
  }

  .metric strong {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .metric span {
    display: block;
    font-size: 14px;
    line-height: 1.35;
  }

  .status-pill,
  .risk-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .status-running { background: rgba(13, 92, 99, 0.12); color: var(--accent-strong); }
  .status-configured,
  .status-success { background: rgba(36, 112, 76, 0.12); color: var(--success); }
  .status-partial,
  .status-timeout,
  .status-missing { background: rgba(184, 106, 27, 0.12); color: var(--warning); }
  .status-failed,
  .status-disabled,
  .status-not_configured { background: rgba(178, 58, 48, 0.12); color: var(--danger); }
  .risk-low { background: rgba(36, 112, 76, 0.12); color: var(--success); }
  .risk-medium { background: rgba(184, 106, 27, 0.12); color: var(--warning); }
  .risk-high { background: rgba(178, 58, 48, 0.12); color: var(--danger); }

  .provider-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .comparison-panel {
    border-radius: 8px;
    display: grid;
    gap: 12px;
  }

  .comparison-panel h2 {
    font-size: 18px;
  }

  .comparison-empty,
  .results-empty,
  .source-empty {
    border: 1px dashed var(--line-strong);
    background: rgba(255, 255, 255, 0.6);
    color: var(--muted);
    border-radius: 8px;
    padding: 14px;
  }

  .results-grid {
    grid-template-columns: 1fr;
  }

  .result-panel {
    display: grid;
    gap: 14px;
  }

  .section-title {
    font-size: 16px;
  }

  .supplier-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .supplier-card,
  .source-card,
  .warning-card,
  .error-card {
    border: 1px solid rgba(31, 41, 55, 0.08);
    background: var(--panel-strong);
    border-radius: 8px;
    padding: 12px;
    display: grid;
    gap: 8px;
  }

  .supplier-card h3 {
    margin: 0;
    font-size: 15px;
  }

  .supplier-meta {
    display: grid;
    gap: 6px;
    font-size: 14px;
    color: var(--muted);
  }

  .supplier-meta strong,
  .source-card strong,
  .warning-card strong,
  .error-card strong {
    color: var(--text);
  }

  a {
    color: var(--accent-strong);
    text-decoration: none;
    word-break: break-word;
  }

  details {
    border: 1px solid rgba(31, 41, 55, 0.08);
    background: rgba(255, 255, 255, 0.72);
    border-radius: 8px;
    padding: 10px 12px;
  }

  summary {
    cursor: pointer;
    font-weight: 700;
    color: var(--accent-strong);
  }

  .raw-source-list {
    display: grid;
    gap: 8px;
    margin-top: 10px;
  }

  .raw-source-item {
    border-top: 1px solid rgba(31, 41, 55, 0.08);
    padding-top: 8px;
    font-size: 14px;
    color: var(--muted);
  }

  .stack {
    display: grid;
    gap: 10px;
  }

  @media (max-width: 960px) {
    .control-band,
    .provider-meta,
    .run-metrics,
    .comparison-grid,
    .supplier-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div class="brand">
        <div class="brand-mark">V</div>
        <div>
          <h1>Search Provider Benchmark Lab</h1>
          <p>VORA AI prototype for side-by-side sourcing provider evaluation</p>
        </div>
      </div>
      <div class="topbar-note">/benchmark/analyze primary route</div>
    </section>

    <section class="control-band">
      <div class="field">
        <label for="productInput">Product</label>
        <input id="productInput" type="text" placeholder="Try: Vintage T9, wireless earbuds, portable blender">
      </div>
      <button id="runAllButton" class="button-primary" type="button">Run all configured providers</button>
      <button id="refreshProvidersButton" class="button-secondary" type="button">Refresh providers</button>
    </section>

    <section id="comparisonPanel" class="comparison-panel">
      <h2>Comparison Summary</h2>
      <div class="comparison-empty">Load providers, enter a product, and run one or more providers to compare latency, completeness, and cost risk.</div>
    </section>

    <section id="providerGrid" class="provider-grid"></section>
    <section id="resultsPanel" class="results-grid">
      <div class="results-empty">No provider runs yet.</div>
    </section>
  </main>

<script>
const productInput = document.getElementById("productInput");
const providerGrid = document.getElementById("providerGrid");
const comparisonPanel = document.getElementById("comparisonPanel");
const resultsPanel = document.getElementById("resultsPanel");
const runAllButton = document.getElementById("runAllButton");
const refreshProvidersButton = document.getElementById("refreshProvidersButton");

let providerInfos = [];
const runState = new Map();

runAllButton.addEventListener("click", runAllConfigured);
refreshProvidersButton.addEventListener("click", loadProviders);
productInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    runAllConfigured();
  }
});

loadProviders();

async function loadProviders() {
  const response = await fetch("/providers");
  const data = await response.json();
  providerInfos = data.providers || [];
  renderProviderCards();
}

async function runProvider(providerId) {
  const product = productInput.value.trim();
  if (!product) {
    productInput.focus();
    return;
  }
  markRunning([providerId]);
  const response = await fetch("/benchmark/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ product, providers: [providerId] })
  });
  const data = await response.json();
  renderBenchmarkResponse(data);
}

async function runAllConfigured() {
  const product = productInput.value.trim();
  if (!product) {
    productInput.focus();
    return;
  }
  const configuredIds = providerInfos
    .filter((provider) => provider.configured && provider.enabled)
    .map((provider) => provider.provider_id);
  if (configuredIds.length === 0) {
    return;
  }
  markRunning(configuredIds);
  const response = await fetch("/benchmark/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ product, providers: configuredIds })
  });
  const data = await response.json();
  renderBenchmarkResponse(data);
}

function markRunning(providerIds) {
  providerIds.forEach((providerId) => {
    runState.set(providerId, { status: "running" });
  });
  renderProviderCards();
}

function renderProviderCards() {
  if (providerInfos.length === 0) {
    providerGrid.innerHTML = '<div class="results-empty">No provider metadata available.</div>';
    return;
  }

  providerGrid.innerHTML = providerInfos.map((provider) => {
    const run = runState.get(provider.provider_id);
    const uiStatus = run?.status || providerStatusLabel(provider);
    const statusClass = `status-${uiStatus.replace(/[^a-z_]/g, "")}`;
    const missingConfig = provider.missing_config?.length
      ? escapeHtml(provider.missing_config.join(", "))
      : "None";

    return `
      <article class="provider-card">
        <div class="provider-head">
          <div class="provider-title">
            <div class="eyebrow">Provider</div>
            <h2>${escapeHtml(provider.provider_name)}</h2>
          </div>
          <span class="status-pill ${statusClass}">${escapeHtml(uiStatus)}</span>
        </div>
        <div class="provider-meta">
          ${metric("Requires Gemini analysis", provider.requires_gemini_analysis ? "Yes" : "No")}
          ${metric("Missing config", missingConfig)}
          ${metric("Production risk", `<span class="risk-pill risk-${escapeHtml(provider.production_risk)}">${escapeHtml(provider.production_risk)}</span>`)}
          ${metric("Cost notes", escapeHtml(provider.cost_notes || "Not provided"))}
        </div>
        <div class="provider-actions">
          <button class="button-primary" type="button" onclick="runProvider('${escapeAttribute(provider.provider_id)}')" ${run?.status === "running" ? "disabled" : ""}>Run provider</button>
        </div>
      </article>
    `;
  }).join("");
}

function renderBenchmarkResponse(data) {
  const runs = data.runs || [];
  runs.forEach((run) => runState.set(run.provider_id, run));
  renderProviderCards();
  renderComparison(data.comparison_summary, data.intent);
  renderResults(runs, data.intent);
}

function renderComparison(summary, intent) {
  if (!intent?.is_valid_product) {
    comparisonPanel.innerHTML = `
      <h2>Comparison Summary</h2>
      <div class="comparison-empty">${escapeHtml(intent?.reason || "Product rejected before provider execution.")}</div>
    `;
    return;
  }

  if (!summary) {
    comparisonPanel.innerHTML = `
      <h2>Comparison Summary</h2>
      <div class="comparison-empty">No comparison summary available.</div>
    `;
    return;
  }

  comparisonPanel.innerHTML = `
    <h2>Comparison Summary</h2>
    <div class="comparison-grid">
      ${metric("Fastest provider", escapeHtml(summary.fastest_provider || "None"))}
      ${metric("Most Tunisian results", escapeHtml(summary.most_tunisian_results || "None"))}
      ${metric("Most Chinese results", escapeHtml(summary.most_chinese_results || "None"))}
      ${metric("Most source-backed prices", escapeHtml(summary.most_source_backed_prices || "None"))}
      ${metric("Most complete provider", escapeHtml(summary.most_complete_provider || "None"))}
      ${metric("Lowest cost risk", escapeHtml(summary.lowest_cost_risk || "None"))}
      ${metric("Notes", escapeHtml(summary.notes || "No notes"))}
    </div>
  `;
}

function renderResults(runs, intent) {
  if (!intent?.is_valid_product) {
    resultsPanel.innerHTML = `<div class="results-empty">${escapeHtml(intent?.reason || "Product rejected.")}</div>`;
    return;
  }
  if (!runs || runs.length === 0) {
    resultsPanel.innerHTML = '<div class="results-empty">No provider runs were returned.</div>';
    return;
  }

  resultsPanel.innerHTML = runs.map((run) => `
    <article class="result-panel">
      <div class="result-head">
        <div>
          <div class="eyebrow">Provider run</div>
          <h2>${escapeHtml(run.provider_name)}</h2>
        </div>
        <span class="status-pill status-${escapeHtml(run.status)}">${escapeHtml(run.status)}</span>
      </div>

      <div class="run-metrics">
        ${metric("latency_ms", String(run.latency_ms ?? 0))}
        ${metric("raw_sources_count", String(run.raw_sources_count ?? 0))}
        ${metric("provider_api_calls", String(run.provider_api_calls ?? 0))}
        ${metric("gemini_intent_calls", String(run.gemini_intent_calls ?? 0))}
        ${metric("gemini_analysis_calls", String(run.gemini_analysis_calls ?? 0))}
        ${metric("raw_queries_count", String(run.raw_queries_count ?? 0))}
        ${metric("production_risk", `<span class="risk-pill risk-${escapeHtml(run.production_risk)}">${escapeHtml(run.production_risk)}</span>`)}
        ${metric("cost_notes", escapeHtml(run.cost_notes || "Not provided"))}
      </div>

      <div class="stack">
        <div>
          <div class="section-title">Market summary</div>
          <div class="source-empty">${escapeHtml(run.market_summary || "No market summary returned.")}</div>
        </div>

        <div class="supplier-grid">
          <div class="stack">
            <div class="section-title">Tunisia local market prices</div>
            ${renderSuppliers(run.tunisia_cheapest_suppliers, "tnd")}
          </div>
          <div class="stack">
            <div class="section-title">China wholesale product prices</div>
            ${renderSuppliers(run.china_cheapest_suppliers, "usd")}
          </div>
        </div>

        <div class="stack">
          <div class="section-title">Source URLs</div>
          ${renderSources(run.research_sources)}
        </div>

        <div class="stack">
          <div class="section-title">Warnings</div>
          ${renderMessages(run.warnings, "warning-card")}
        </div>

        <div class="stack">
          <div class="section-title">Errors</div>
          ${renderMessages(run.errors, "error-card")}
        </div>

        <details class="raw-evidence">
          <summary>Raw evidence</summary>
          ${renderRawEvidence(run.raw_sources)}
        </details>
      </div>
    </article>
  `).join("");
}

function renderSuppliers(suppliers, currencyMode) {
  if (!suppliers || suppliers.length === 0) {
    return '<div class="source-empty">No validated results.</div>';
  }
  return suppliers.map((supplier) => `
    <div class="supplier-card">
      <h3>${escapeHtml(supplier.name || (currencyMode === "usd" ? "Product offer" : "Unknown supplier"))}</h3>
      <div class="supplier-meta">
        <div><strong>Rank:</strong> ${escapeHtml(String(supplier.rank ?? ""))}</div>
        <div><strong>Type:</strong> ${escapeHtml(supplier.type || "unknown")}</div>
        ${currencyMode === "usd" ? `<div><strong>Product offer:</strong> ${escapeHtml(supplier.product_title || supplier.name || "Not provided")}</div>` : ""}
        <div><strong>Product:</strong> ${escapeHtml(supplier.product_title || "Not provided")}</div>
        <div><strong>Price:</strong> ${escapeHtml(currencyMode === "tnd" ? (supplier.price_range_tnd || "Not found") : (supplier.price_range_usd || "Not found"))}</div>
        ${currencyMode === "usd" ? `<div><strong>MOQ:</strong> ${escapeHtml(supplier.moq || "Not found")}</div>` : ""}
        <div><strong>Evidence level:</strong> ${escapeHtml(supplier.evidence_level || "weak")}</div>
        <div><strong>Confidence:</strong> ${escapeHtml(supplier.confidence || "low")}</div>
        <div><strong>product_match:</strong> ${escapeHtml(supplier.product_match || "broad")}</div>
        <div><strong>match_notes:</strong> ${escapeHtml(supplier.match_notes || "None")}</div>
        <div><strong>Price evidence:</strong> ${escapeHtml(supplier.price_evidence || "not_found")}</div>
        ${currencyMode === "usd" ? `<div><strong>MOQ evidence:</strong> ${escapeHtml(supplier.moq_evidence || "not_found")}</div>` : ""}
        <div><strong>Notes:</strong> ${escapeHtml(supplier.notes || "None")}</div>
        <div><strong>Source:</strong> ${supplier.source_url ? `<a href="${escapeAttribute(supplier.source_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(supplier.source_url)}</a>` : "No source URL"}</div>
      </div>
    </div>
  `).join("");
}

function renderSources(sources) {
  if (!sources || sources.length === 0) {
    return '<div class="source-empty">No research sources returned.</div>';
  }
  return sources.map((source) => `
    <div class="source-card">
      <strong>${escapeHtml(source.title || source.url)}</strong>
      <div>${escapeHtml(source.source_type || "unknown")}</div>
      <a href="${escapeAttribute(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.url)}</a>
    </div>
  `).join("");
}

function renderMessages(messages, className) {
  if (!messages || messages.length === 0) {
    return '<div class="source-empty">None.</div>';
  }
  return messages.map((message) => `
    <div class="${className}">
      <strong>${className === "warning-card" ? "Warning" : "Error"}</strong>
      <div>${escapeHtml(message)}</div>
    </div>
  `).join("");
}

function renderRawEvidence(rawSources) {
  if (!rawSources || rawSources.length === 0) {
    return '<div class="source-empty">No raw provider evidence returned.</div>';
  }
  return `
    <div class="raw-source-list">
      ${rawSources.map((source, index) => `
        <div class="raw-source-item">
          <strong>Source ${index + 1}</strong><br>
          Title: ${escapeHtml(source.title || "")}<br>
          URL: ${escapeHtml(source.url || "")}<br>
          Region: ${escapeHtml(source.region_hint || "unknown")}<br>
          Type: ${escapeHtml(source.source_type || "unknown")}<br>
          Snippet: ${escapeHtml(source.snippet || "")}<br>
          Content: ${escapeHtml(source.content || "")}
        </div>
      `).join("")}
    </div>
  `;
}

function providerStatusLabel(provider) {
  if (!provider.enabled) return "disabled";
  if (provider.configured) return "configured";
  return "missing";
}

function metric(label, value) {
  return `
    <div class="metric">
      <strong>${label}</strong>
      <span>${value}</span>
    </div>
  `;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function escapeAttribute(value) {
  return escapeHtml(value);
}
</script>
</body>
</html>
